import javax.inject.Inject

plugins {
  id 'java'
}

group = "co.elastic"
version = "1.0.0-SNAPSHOT"

repositories {
  mavenCentral()
}

configurations {
  antlrTool
}

dependencies {
  implementation("org.antlr:antlr4:4.13.1")
  testImplementation("junit:junit:4.13.2")
  antlrTool "org.antlr:antlr4:4.13.1"
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

/**********************************************
 *         ES|QL parser generation             *
 **********************************************/

// One grammar per released version under grammars/<id>/, plus an optional, untracked local/ grammar with the
// id "local". Each has EsqlBaseLexer.g4 and EsqlBaseParser.g4 at the top, imported grammars under lexer/ and
// parser/, and a source.txt with "ref:" and "commit:" lines.

// Keep in sync with EsqlGrammar.packageFor.
static String grammarPackage(String id) {
  return 'co.elastic.grammar.v' + id.replace('.', '_')
}

static Map<String, String> readSource(File dir) {
  Map<String, String> values = [:]
  File source = new File(dir, 'source.txt')
  if (source.isFile()) {
    source.eachLine('UTF-8') { line ->
      int colon = line.indexOf(':')
      if (colon > 0) {
        values[line.substring(0, colon).trim()] = line.substring(colon + 1).trim()
      }
    }
  }
  return values
}

/** Runs the ANTLR tool on one grammar directory: the lexer first, then the parser that reads its tokens. */
abstract class GenerateGrammar extends DefaultTask {
  @InputDirectory
  abstract DirectoryProperty getGrammarDir()

  @Classpath
  abstract ConfigurableFileCollection getToolClasspath()

  @Input
  abstract Property<String> getPackageName()

  @OutputDirectory
  abstract DirectoryProperty getOutputRoot()

  /** Holds the tokens.txt resource, see writeTokens. */
  @OutputDirectory
  abstract DirectoryProperty getResourceRoot()

  @Inject
  abstract ExecOperations getExecOperations()

  @Inject
  abstract FileSystemOperations getFileSystemOperations()

  @TaskAction
  void generate() {
    File outRoot = outputRoot.get().asFile
    fileSystemOperations.delete { it.delete(outRoot) }
    File outDir = new File(outRoot, packageName.get().replace('.', '/'))
    run(outDir, 'EsqlBaseLexer.g4', 'lexer')
    // the parser finds EsqlBaseLexer.tokens in the output directory
    run(outDir, 'EsqlBaseParser.g4', 'parser')
    File resourceRoot = resourceRoot.get().asFile
    fileSystemOperations.delete { it.delete(resourceRoot) }
    writeTokens(new File(outDir, 'EsqlBaseLexer.tokens'),
      new File(resourceRoot, packageName.get().replace('.', '/') + '/tokens.txt'))
  }

  // A lexer rule that is a predicate and then one literal, such as
  //   DEV_JOIN_LEFT : {this.isDevVersion()}? 'left' -> pushMode(JOIN_MODE);
  // ANTLR gives such tokens no literal name, so the .tokens file lacks it.
  private static final java.util.regex.Pattern GATED_LITERAL_RULE = java.util.regex.Pattern.compile(
    /^\s*([A-Z][A-Z0-9_]*)\s*:\s*\{[^{}]*\}\?\s*('(?:[^'\\]|\\.)*')\s*(?:->[^;]*)?;\s*(?:\/\/.*)?$/)

  /**
   * Writes the lexer's .tokens file (NAME=type and 'literal'=type lines) as a resource, so token names and
   * literals can be read without loading the generated classes. Tokens of predicate-gated rules get a
   * 'literal'=type line taken from the lexer grammar.
   */
  private void writeTokens(File tokens, File out) {
    List<String> lines = tokens.readLines('UTF-8').findAll { !it.isBlank() }
    Map<String, String> typeByName = [:]
    Set<String> typesWithLiteral = [] as Set
    lines.each { line ->
      int eq = line.lastIndexOf('=')
      String key = line.substring(0, eq)
      String type = line.substring(eq + 1)
      if (key.startsWith("'")) {
        typesWithLiteral << type
      } else {
        typeByName[key] = type
      }
    }
    List<String> extra = []
    grammarDir.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { File g4 ->
      if (!g4.name.endsWith('.g4')) {
        return
      }
      g4.eachLine('UTF-8') { line ->
        def m = GATED_LITERAL_RULE.matcher(line)
        if (m.matches()) {
          String type = typeByName[m.group(1)]
          if (type != null && !typesWithLiteral.contains(type)) {
            typesWithLiteral << type
            extra << "${m.group(2)}=${type}".toString()
          }
        }
      }
    }
    out.parentFile.mkdirs()
    out.setText((lines + extra.sort()).join('\n') + '\n', 'UTF-8')
  }

  private void run(File outDir, String grammar, String lib) {
    File dir = grammarDir.get().asFile
    execOperations.javaexec {
      it.mainClass.set('org.antlr.v4.Tool')
      it.classpath = toolClasspath
      it.systemProperty 'file.encoding', 'UTF-8'
      it.systemProperty 'user.language', 'en'
      it.systemProperty 'user.country', 'US'
      it.systemProperty 'user.variant', ''
      it.args '-Werror',
        '-package', packageName.get(),
        '-listener',
        '-visitor',
        '-lib', new File(dir, lib).absolutePath,
        '-o', outDir.absolutePath,
        new File(dir, grammar).absolutePath
    }
  }
}

List<File> releasedDirs = (file('grammars').listFiles() ?: new File[0]).findAll { it.isDirectory() }
releasedDirs.each { dir ->
  if (!(dir.name ==~ /\d+\.\d+/)) {
    throw new GradleException("Grammar directory name must be a version like 9.5: ${dir}")
  }
}
if (releasedDirs.isEmpty()) {
  throw new GradleException("No grammars found under ${file('grammars')}")
}
releasedDirs.sort { a, b ->
  def (aMajor, aMinor) = a.name.tokenize('.')*.toInteger()
  def (bMajor, bMinor) = b.name.tokenize('.')*.toInteger()
  aMajor <=> bMajor ?: aMinor <=> bMinor
}

Map<String, File> grammars = [:]
releasedDirs.each { grammars[it.name] = it }
List<String> versionLines = releasedDirs.collect { "released ${it.name}".toString() }

File localDir = file('local')
if (localDir.isDirectory()) {
  Map<String, String> source = readSource(localDir)
  if (!source.ref || !source.commit) {
    throw new GradleException("${localDir}/source.txt must have ref: and commit: lines")
  }
  grammars['local'] = localDir
  versionLines << "local ${source.ref} ${source.commit}".toString()
}

grammars.each { String id, File dir ->
  def generate = tasks.register("generateGrammar_${id.replace('.', '_')}", GenerateGrammar) {
    group = 'antlr'
    description = "Generates the ES|QL ${id} lexer and parser."
    grammarDir = dir
    toolClasspath.from(configurations.antlrTool)
    packageName = grammarPackage(id)
    outputRoot = layout.buildDirectory.dir("generated-src/antlr/${id}")
    resourceRoot = layout.buildDirectory.dir("generated-resources/antlr/${id}")
  }
  sourceSets.main.java.srcDir(generate.flatMap { it.outputRoot })
  sourceSets.main.resources.srcDir(generate.flatMap { it.resourceRoot })
}

def writeGrammarVersions = tasks.register('writeGrammarVersions') {
  group = 'antlr'
  description = 'Writes the list of generated grammar versions.'
  def outRoot = layout.buildDirectory.dir('generated-resources/grammar')
  inputs.property('lines', versionLines)
  outputs.dir(outRoot)
  doLast {
    File out = outRoot.get().file('co/elastic/grammar/versions.txt').asFile
    out.parentFile.mkdirs()
    out.setText(versionLines.join('\n') + '\n', 'UTF-8')
  }
}

sourceSets.main.resources.srcDir(writeGrammarVersions)
